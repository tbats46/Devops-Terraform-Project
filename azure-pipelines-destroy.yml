trigger: none

variables:
  resourceGroup: 'rg-tf-backend'
  storageAccount: 'sttfstate1234'
  containerName: 'tfstate'
  tfStateKey: 'devpipeline.terraform.tfstate'
  serviceConnection: 'devtest-service-connection'

stages:
  - stage: tf_destroy
    displayName: 'Terraform Destroy Stage'
    jobs:
      - job: destroy
        steps:
          - task: TerraformInstaller@0
            displayName: 'TF Install'
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV2@2
            displayName: 'TF Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: '$(serviceConnection)'
              backendAzureRmResourceGroupName: '$(resourceGroup)'
              backendAzureRmStorageAccountName: '$(storageAccount)'
              backendAzureRmContainerName: '$(containerName)'
              backendAzureRmKey: '$(tfStateKey)'

          - task: TerraformTaskV2@2
            displayName: 'TF Plan (Destroy)'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              commandOptions: '-destroy'
              environmentServiceNameAzureRM: '$(serviceConnection)'

          - task: TerraformTaskV2@2
            displayName: 'TF Destroy'
            inputs:
              provider: 'azurerm'
              command: 'destroy'
              environmentServiceNameAzureRM: '$(serviceConnection)'
